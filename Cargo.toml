[package]
name = "whispernet"
version = "0.1.0"
edition = "2021"

[dependencies]
arti-client = { version = "0.42.0", features = ["onion-service-service", "onion-service-client", "experimental-api", "tokio"] }
tor-hsservice = "0.42.0"
tor-rtcompat = "0.42.0"
tor-cell = "0.42.0"
tor-hscrypto = "0.42.0"
rusqlite = { version = "0.36.0", features = ["bundled-sqlcipher-vendored-openssl"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
x25519-dalek = { version = "2.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"
anyhow = "1.0"
hkdf = "0.12"
sha2 = "0.10"
sha3 = "0.10"
rand_core = "0.6"
hex = "0.4"
chacha20poly1305 = "0.10"
data-encoding = "2.6.0"
